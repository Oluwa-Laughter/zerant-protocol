[workspace]
members = ["crates/zerant-core", "crates/zerant-credential", "crates/zerant-policy", "crates/zerant-disclosure", "crates/zerant-zcash", "services/zerant-api"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
serde_json_canonicalizer = "=0.3.2"
url = "2"
josekit = "=0.10.3"
sha2 = "0.10"
